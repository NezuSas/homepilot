services:
  homepilot-api:
    network_mode: !reset null
    ports:
      - "${HOMEPILOT_API_PORT:-3000}:3000"
    environment:
      INTERNAL_HA_URL: ${INTERNAL_HA_URL:-http://host.docker.internal:18123}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      TTS_BASE_URL: ${TTS_BASE_URL:-http://homepilot-tts:8088}
      STT_BASE_URL: ${STT_BASE_URL:-http://homepilot-stt:8090}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  homepilot-ui:
    volumes:
      - ./docker/ui/nginx.windows.conf:/etc/nginx/conf.d/default.conf:ro