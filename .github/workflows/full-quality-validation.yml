name: Full quality validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-quality:
    name: Complete quality gates including responsive
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Install responsive test browser
        run: npx playwright install --with-deps chromium
      - name: Run complete quality gate
        run: npm run verify:quality
