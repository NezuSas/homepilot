# Opt-in local language model for the assistant. It is NOT part of any default profile:
# HomePilot answers deterministically unless this overlay is added to the compose command.
#
#   docker compose -f docker-compose.yml -f docker-compose.ha-companion.desktop.yml \
#     -f docker-compose.assistant-llm.yml up -d --no-deps homepilot-api
#
# The model runs in Ollama on the host (GPU recommended; qwen3:8b needs about 6 GB of VRAM):
#   ollama pull qwen3:8b
# The model only proposes a plan; authorization, validation, confidence and confirmations stay in
# HomePilot, and any failure or timeout falls back to the deterministic assistant.
services:
  homepilot-api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: ${HOMEPILOT_LLM_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${HOMEPILOT_LLM_MODEL:-qwen3:8b}
      OLLAMA_TIMEOUT_MS: "8000"
      OLLAMA_NUM_CTX: "2048"
      ASSISTANT_PLANNER_V2_EXECUTION: "true"
      ASSISTANT_PLANNER_V2_EXECUTION_TIMEOUT_MS: "4000"
      ASSISTANT_PLANNER_V2_SHADOW: "false"
      ASSISTANT_PLANNER_V2_SHADOW_ULTRA_LIGHT_PROMPT: "false"
      ASSISTANT_PLANNER_V2_SHADOW_LIGHT_PROMPT: "true"
      ASSISTANT_LEGACY_LLM_INTERPRETER: "false"
