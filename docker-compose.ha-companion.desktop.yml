services:
  homepilot-api:
    network_mode: !reset null
    ports:
      - "${HOMEPILOT_API_PORT:-13000}:3000"
    environment:
      HOMEPILOT_RUNTIME_TARGET: docker_desktop
      TTS_BASE_URL: http://homepilot-tts:8088
      STT_BASE_URL: http://homepilot-stt:8090
    extra_hosts:
      - "host.docker.internal:host-gateway"

  homepilot-ui:
    ports: !override
      - "${HOMEPILOT_UI_PORT:-8080}:80"
    volumes:
      - ./docker/ui/nginx.desktop.conf:/etc/nginx/conf.d/default.conf:ro
