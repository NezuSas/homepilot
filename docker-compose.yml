services:
  homepilot-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: homepilot-api
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - /etc/localtime:/etc/localtime:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOMEPILOT_DB_PATH=/app/data/homepilot.db
      - HOMEPILOT_BACKUP_DIR=/app/backups
      - INTERNAL_HA_URL=${INTERNAL_HA_URL:-http://homeassistant:8123}
      - HOMEPILOT_RUNTIME_TARGET=linux_edge
      - HOMEPILOT_HOME_ASSISTANT_SETUP_URL=${HOMEPILOT_HOME_ASSISTANT_SETUP_URL:-http://localhost:18123}
      - HOMEPILOT_DEV_BOOTSTRAP=${HOMEPILOT_DEV_BOOTSTRAP:-false}
      - HOMEPILOT_INSTALLATION_PROFILE=${HOMEPILOT_INSTALLATION_PROFILE:-ha_companion}
      - CORS_ORIGIN=http://localhost,http://localhost:5173,http://127.0.0.1:5173
      - HOMEPILOT_AUTH_MAX_FAILURES=${HOMEPILOT_AUTH_MAX_FAILURES:-5}
      - HOMEPILOT_AUTH_LOCKOUT_MS=${HOMEPILOT_AUTH_LOCKOUT_MS:-900000}
      - DIRECTORY_SSO_PUBLIC_KEY=${DIRECTORY_SSO_PUBLIC_KEY:-}
      - HOMEPILOT_INTEGRATION_API_KEY=${HOMEPILOT_INTEGRATION_API_KEY:-}

      - TTS_PROVIDER=${TTS_PROVIDER:-kokoro}
      - TTS_BASE_URL=${TTS_BASE_URL:-http://127.0.0.1:8088}
      - TTS_TIMEOUT_MS=${TTS_TIMEOUT_MS:-45000}
      - STT_PROVIDER=${STT_PROVIDER:-whisper-local}
      - STT_BASE_URL=${STT_BASE_URL:-http://127.0.0.1:8090}
      - STT_TIMEOUT_MS=${STT_TIMEOUT_MS:-60000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      homeassistant:
        condition: service_healthy
      homepilot-tts:
        condition: service_started
      homepilot-stt:
        condition: service_started

  homepilot-ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-}"
        VITE_HOME_CITY: "${VITE_HOME_CITY:-Cuenca}"
    container_name: homepilot-ui
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - homepilot-api

  homeassistant:
    image: homeassistant/home-assistant:stable
    container_name: homeassistant
    volumes:
      - ./ha-config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=UTC
    ports:
      - "18123:8123"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8123" ]
      interval: 60s
      timeout: 10s
      retries: 5
    depends_on:
      homepilot-mqtt:
        condition: service_healthy
    restart: unless-stopped

  homepilot-mqtt:
    image: eclipse-mosquitto:2
    container_name: homepilot-mqtt
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - homepilot-mqtt-credentials:/mosquitto/credentials:ro
    healthcheck:
      test: [ "CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null 2>&1" ]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  homepilot-tts:
    build:
      context: .
      dockerfile: services/tts-piper/Dockerfile
    container_name: homepilot-tts
    environment:
      - TTS_ENGINE=${TTS_PROVIDER:-kokoro}
      - KOKORO_VOICE_ES=${KOKORO_VOICE_ES:-em_alex}
      - KOKORO_VOICE_EN=${KOKORO_VOICE_EN:-af_heart}
      - PIPER_VOICE_ES=${PIPER_VOICE_ES:-es_MX-claude-high}
      - PIPER_FALLBACK_VOICE_ES=${PIPER_FALLBACK_VOICE_ES:-es_ES-sharvard-medium}
      - PIPER_VOICE_EN=${PIPER_VOICE_EN:-en_US-lessac-medium}
      - PIPER_SYNTHESIS_TIMEOUT_SECONDS=${PIPER_SYNTHESIS_TIMEOUT_SECONDS:-20}
    ports:
      - "8088:8088"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  homepilot-stt:
    build:
      context: .
      dockerfile: services/stt-whisper/Dockerfile
      args:
        - WHISPER_MODEL=${WHISPER_MODEL:-small}
        - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
    container_name: homepilot-stt
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - WHISPER_BEAM_SIZE=${WHISPER_BEAM_SIZE:-3}
      - WHISPER_VAD_MIN_SILENCE_MS=${WHISPER_VAD_MIN_SILENCE_MS:-650}
      - WHISPER_VAD_SPEECH_PAD_MS=${WHISPER_VAD_SPEECH_PAD_MS:-400}
      - WHISPER_MAX_AUDIO_BYTES=${WHISPER_MAX_AUDIO_BYTES:-9000000}
      - WHISPER_HOTWORDS=${WHISPER_HOTWORDS:-Ok Nezu, OK Nezu, Okey Nezu, Okay Nezu, Okei Nezu, ok Nesu, ok Ne Su, ok Nezo, ok Neso}
    ports:
      - "8090:8090"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  data:
  ha-config:
  homepilot-mqtt-credentials:
    name: homepilot-mqtt-credentials
    external: true
